apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowedtags
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowedTags
      validation:
        openAPIV3Schema:
          type: object
          properties:
            tags:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: Rego
          source:
            version: "v1"
            rego: |
              package k8sdisallowedtags

              containers contains c if {
                some c in input.review.object.spec.template.spec.containers
              }

              containers contains c if {
                some c in input.review.object.spec.containers
              }

              # The part after the last "/" holds the tag; no ":" means no tag.
              tag(image) := t if {
                parts := split(image, "/")
                name := parts[count(parts) - 1]
                contains(name, ":")
                t := split(name, ":")[1]
              } else := "latest"

              violation contains {"msg": msg} if {
                some c in containers
                t := tag(c.image)
                t in input.parameters.tags
                msg := sprintf("container <%v> uses disallowed tag <%v> (image %v)", [c.name, t, c.image])
              }
