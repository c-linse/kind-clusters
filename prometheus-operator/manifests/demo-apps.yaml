# Demo workloads that expose Prometheus metrics. Local dev only.
#
# Deliberately NO scrape config here: no prometheus.io/* annotations, no
# ServiceMonitors / PodMonitors. Every container port that serves metrics is
# named "metrics" (or "http" where the app serves /metrics on its main port),
# so they are easy to target.
#
#   Workload     Pattern                     Service:port         Path
#   podinfo      native, same port as app    podinfo:9898 (http)  /metrics
#   example-app  native, same port as app    example-app:8080 (http) /metrics
#   nginx        exporter sidecar            nginx:9113           /metrics
#   redis        exporter sidecar            redis:9121           /metrics
#   loadgen      curl loop so counters/histograms actually move
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# podinfo: Go app with request counters and latency histograms
# (http_requests_total, http_request_duration_seconds_*).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          command: ["./podinfo", "--port=9898", "--level=info"]
          ports:
            - name: http
              containerPort: 9898
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: demo
  labels:
    app.kubernetes.io/name: podinfo
spec:
  selector:
    app.kubernetes.io/name: podinfo
  ports:
    - name: http
      port: 9898
      targetPort: http
---
# prometheus-example-app: tiny app from the Prometheus Operator docs
# (http_requests_total by code/method, version info).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: example-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-app
    spec:
      containers:
        - name: example-app
          image: quay.io/brancz/prometheus-example-app:v0.6.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: example-app
  namespace: demo
  labels:
    app.kubernetes.io/name: example-app
spec:
  selector:
    app.kubernetes.io/name: example-app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# nginx with nginx-prometheus-exporter as a sidecar reading stub_status.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: demo
data:
  default.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }
    server {
      listen 127.0.0.1:8080;
      location /stub_status {
        stub_status;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.6-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.5.3
          args: ["--nginx.scrape-uri=http://127.0.0.1:8080/stub_status"]
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: demo
  labels:
    app.kubernetes.io/name: nginx
spec:
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9113
      targetPort: metrics
---
# Redis with redis_exporter as a sidecar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
        - name: exporter
          image: oliver006/redis_exporter:v1.93.0-alpine
          env:
            - name: REDIS_ADDR
              value: redis://127.0.0.1:6379
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: demo
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: metrics
      port: 9121
      targetPort: metrics
---
# Generates a mix of 2xx / 4xx / 5xx and slow requests against the apps above.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.22.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i+1))
                curl -s -o /dev/null http://podinfo:9898/
                curl -s -o /dev/null http://podinfo:9898/status/404
                [ $((i % 5)) -eq 0 ] && curl -s -o /dev/null http://podinfo:9898/status/500
                [ $((i % 10)) -eq 0 ] && curl -s -o /dev/null http://podinfo:9898/delay/2
                curl -s -o /dev/null http://example-app:8080/
                [ $((i % 4)) -eq 0 ] && curl -s -o /dev/null http://example-app:8080/err
                curl -s -o /dev/null http://nginx/
                sleep 1
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
