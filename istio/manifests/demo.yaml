# Two versions of one app behind the Istio ingress gateway. The `demo`
# namespace has sidecar injection on; a VirtualService splits traffic
# 90/10 between the v1 and v2 subsets of the `app` Service.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v1
  namespace: demo
  labels:
    app: app
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
      version: v1
  template:
    metadata:
      labels:
        app: app
        version: v1
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0.0
          args:
            - -listen=:8080
            - -text=app v1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v2
  namespace: demo
  labels:
    app: app
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
      version: v2
  template:
    metadata:
      labels:
        app: app
        version: v2
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0.0
          args:
            - -listen=:8080
            - -text=app v2
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
---
# Selects both versions; the DestinationRule subsets tell them apart.
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: demo
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: demo
  namespace: demo
spec:
  selector:
    istio: ingress
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "example.com"
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: app
  namespace: demo
spec:
  host: app.demo.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: app
  namespace: demo
spec:
  hosts:
    - "example.com"
    - "api.example.com"
  gateways:
    - demo
  http:
    - match:
        - headers:
            x-version:
              exact: v2
      route:
        - destination:
            host: app.demo.svc.cluster.local
            subset: v2
    - route:
        - destination:
            host: app.demo.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: app.demo.svc.cluster.local
            subset: v2
          weight: 10
