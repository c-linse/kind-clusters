# Reads the file written by write-file from the shared workspace.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: read-file
spec:
  workspaces:
    - name: input
  steps:
    - name: read
      image: busybox:1.37
      script: |
        #!/bin/sh
        cat $(workspaces.input.path)/message.txt
