kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argo-workflows
nodes:
  - role: control-plane
    extraPortMappings:
      # Argo Workflows UI / API  -> http://localhost:2746
      - containerPort: 30746
        hostPort: 2746
        protocol: TCP
      # SeaweedFS S3 endpoint     -> http://localhost:8333
      - containerPort: 30333
        hostPort: 8333
        protocol: TCP
      # PostgreSQL                -> localhost:5432
      - containerPort: 30432
        hostPort: 5432
        protocol: TCP
      # Kafka (EXTERNAL listener) -> localhost:9094
      - containerPort: 30094
        hostPort: 9094
        protocol: TCP
      # Kafka UI                  -> http://localhost:8080
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # nginx                     -> http://localhost:8081
      - containerPort: 30081
        hostPort: 8081
        protocol: TCP
