# PostgreSQL connection for workflows, as libpq env vars (use via envFrom).
# Must live in every namespace that runs workflows.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-connection
  namespace: argo
stringData:
  PGHOST: postgres.postgres.svc.cluster.local
  PGPORT: "5432"
  PGDATABASE: app
  PGUSER: app
  PGPASSWORD: app-secret
