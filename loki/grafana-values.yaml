# Values for the grafana-community/grafana Helm chart.

adminUser: admin
adminPassword: admin

service:
  type: NodePort
  nodePort: 30300

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.loki.svc
        isDefault: true
