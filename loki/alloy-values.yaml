# Values for the grafana/alloy Helm chart.
# Tails every pod's logs through the Kubernetes API (no hostPath mounts) and
# pushes them to Loki. A single Deployment replica is enough on a one-node
# cluster; on multi-node you'd switch to a DaemonSet reading /var/log/pods.

controller:
  type: deployment
  replicas: 1

alloy:
  configMap:
    content: |
      logging {
        level = "info"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        // service_name drives Grafana Logs Drilldown grouping.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_container_name"]
          separator     = ";"
          regex         = "^;(.+)$|^([^;]+);.*$"
          replacement   = "$1$2"
          target_label  = "service_name"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // Promote the log level to a label when the line carries one
        // (logfmt level=..., JSON "level":"...").
        stage.regex {
          expression = "(?i)(?:level|lvl|severity)\"?[=:]\\s*\"?(?P<level>[a-z]+)"
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.loki.svc/loki/api/v1/push"
        }
      }
