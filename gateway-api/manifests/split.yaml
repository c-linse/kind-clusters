# Replaces the HTTPRoute `app` from demo.yaml: requests with the header
# `x-version: v2` always go to app-v2, everything else is split 90/10.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: demo
spec:
  parentRefs:
    - name: demo
  rules:
    - matches:
        - headers:
            - name: x-version
              value: v2
      backendRefs:
        - name: app-v2
          port: 80
    - backendRefs:
        - name: app-v1
          port: 80
          weight: 90
        - name: app-v2
          port: 80
          weight: 10
