# Not applied by up.sh. Sends 10% of the traffic for the `app` Service to
# app-v2. Linkerd applies an HTTPRoute whose parentRef is a Service on the
# client side, in the caller's proxy, so only meshed clients see the split.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-split
  namespace: demo
spec:
  parentRefs:
    - group: core
      kind: Service
      name: app
      port: 80
  rules:
    - backendRefs:
        - name: app-v1
          port: 80
          weight: 50
        - name: app-v2
          port: 80
          weight: 50
