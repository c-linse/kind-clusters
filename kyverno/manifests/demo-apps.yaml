# The `kyverno-demo: enabled` label opts a namespace into the demo policies
# and triggers the default-deny-ingress GeneratingPolicy.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    kyverno-demo: enabled
---
# Compliant: team label, pinned image, requests + limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good
  namespace: demo
  labels:
    app: good
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: good
  template:
    metadata:
      labels:
        app: good
        team: platform
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.6-alpine
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
# Admitted but non-compliant: `:latest` image, no resources, and no team
# label on the pod template (the MutatingPolicy adds team=unassigned).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sloppy
  namespace: demo
  labels:
    app: sloppy
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sloppy
  template:
    metadata:
      labels:
        app: sloppy
    spec:
      containers:
        - name: busybox
          image: busybox:latest
          command: ["sleep", "infinity"]
---
# Uses `:latest` too, but is exempted by manifests/exception.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  namespace: demo
  labels:
    app: legacy
    team: legacy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy
  template:
    metadata:
      labels:
        app: legacy
        team: legacy
    spec:
      containers:
        - name: busybox
          image: busybox:latest
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
