apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: "mypol-val"
spec:
  validationActions:
  - Audit
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  validations:
    - expression: "has(object.metadata.labels) && 'example.com/environment' in object.metadata.labels"